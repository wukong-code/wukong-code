name: Test install script

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: dist-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate installer shell syntax
        run: sh -n install.sh

      - name: Validate reviewed public documentation
        run: node scripts/check-public-docs.mjs

      - name: Validate current release truth
        run: node scripts/validate-release-truth.mjs

      - name: Test release and deployment contracts
        run: node --test tests/*.test.mjs

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run install script tests
        run: bats tests/install.bats

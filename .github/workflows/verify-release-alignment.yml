name: Verify Release Version Alignment

on:
  pull_request:
    paths:
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/**'
      - 'scripts/validate-release-truth.mjs'
      - '.github/workflows/verify-release-alignment.yml'
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - 'README.md'
      - 'docs/**'
      - 'scripts/validate-release-truth.mjs'
      - '.github/workflows/verify-release-alignment.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to verify, for example v0.0.22'
        required: false

concurrency:
  group: release-alignment-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-version-alignment:
    name: Block drift before release publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Verify changelog, README, and public docs agree
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            node scripts/validate-release-truth.mjs "${RELEASE_TAG#v}"
          else
            node scripts/validate-release-truth.mjs
          fi
